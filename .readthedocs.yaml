# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: '3.11'
  jobs:
    pre_build:
     - sphinx-apidoc -Mfe -d 2 -o docs ../src/SatelliteCameraViewer

sphinx:
   configuration: docs/conf.py
   builder: 'dirhtml'

python:
  install:
  - path: .
  - requirements: docs/requirements.txt
  - method: pip
    path: .
